name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project KavasAINoteTaker.xcodeproj \
            -scheme KavasAINoteTaker \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        run: |
          APP="build/Build/Products/Debug/KavasAINoteTaker.app"
          if [ ! -d "$APP" ]; then echo "App bundle not found at $APP"; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" KavasAINoteTaker.zip
          ls -lh KavasAINoteTaker.zip

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavasAINoteTaker-app
          path: KavasAINoteTaker.zip
          if-no-files-found: error
